<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2b1a"/>
      <stop offset="50%" stop-color="#5a3d2b"/>
      <stop offset="100%" stop-color="#4a3520"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8b86d"/>
      <stop offset="40%" stop-color="#c99a3b"/>
      <stop offset="100%" stop-color="#a67c2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#e8b86d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8b86d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative border -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="#d4a373" stroke-width="2" opacity="0.3"/>
  <rect x="45" y="45" width="1110" height="540" rx="12" fill="none" stroke="#d4a373" stroke-width="1" opacity="0.15" stroke-dasharray="8 6"/>

  <!-- Furniture Icon (Couch) -->
  <g transform="translate(600, 280)" filter="url(#shadow)">
    <!-- Couch backrest -->
    <rect x="-120" y="-55" width="240" height="80" rx="12" fill="url(#goldGrad)"/>
    <line x1="-90" y1="-30" x2="90" y2="-30" stroke="#8b6914" stroke-width="2.5" opacity="0.3"/>
    <line x1="-90" y1="-15" x2="90" y2="-15" stroke="#8b6914" stroke-width="2.5" opacity="0.3"/>
    <!-- Armrests -->
    <rect x="-145" y="-40" width="30" height="60" rx="8" fill="url(#goldGrad)"/>
    <rect x="115" y="-40" width="30" height="60" rx="8" fill="url(#goldGrad)"/>
    <!-- Seat cushion -->
    <rect x="-105" y="20" width="210" height="22" rx="8" fill="url(#goldGrad)"/>
    <!-- Legs -->
    <rect x="-90" y="42" width="14" height="40" rx="4" fill="#2d1b0e"/>
    <rect x="-30" y="42" width="14" height="40" rx="4" fill="#2d1b0e"/>
    <rect x="30" y="42" width="14" height="40" rx="4" fill="#2d1b0e"/>
    <rect x="76" y="42" width="14" height="40" rx="4" fill="#2d1b0e"/>
    <!-- Tufting -->
    <circle cx="-65" cy="-20" r="5" fill="#a67c2e" opacity="0.4"/>
    <circle cx="0" cy="-20" r="5" fill="#a67c2e" opacity="0.4"/>
    <circle cx="65" cy="-20" r="5" fill="#a67c2e" opacity="0.4"/>
  </g>

  <!-- "JC" Monogram -->
  <text x="600" y="155" font-family="'Georgia','Times New Roman',serif" font-size="90" font-weight="bold" fill="#f0d5a8" text-anchor="middle" letter-spacing="10" filter="url(#shadow)">
    JC
  </text>

  <!-- Tagline -->
  <text x="600" y="470" font-family="'Arial','Helvetica',sans-serif" font-size="22" fill="#d4a373" text-anchor="middle" letter-spacing="6" font-weight="300">
    JOZI CRAFT
  </text>
  <text x="600" y="505" font-family="'Arial','Helvetica',sans-serif" font-size="13" fill="#a08a78" text-anchor="middle" letter-spacing="3" font-weight="300">
    HANDCRAFTED WITH CARE · NATIONWIDE DELIVERY
  </text>

  <line x1="450" y1="520" x2="750" y2="520" stroke="#8b6914" stroke-width="1.5" opacity="0.3"/>
</svg>